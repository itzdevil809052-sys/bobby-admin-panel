<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinGo Monitor</title><style>
:root{font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;background:#202942}.ok{background:#123d2a}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.card{background:#141b2e;border:1px solid #26304a;border-radius:16px;padding:18px}.label{font-size:12px;opacity:.65}.value{font-size:28px;font-weight:800;margin-top:8px}.big{font-size:48px}.controls{display:grid;grid-template-columns:2fr 2fr 2fr 1fr;gap:10px;margin-top:18px}.controls input,.controls button{width:100%;padding:12px;border-radius:10px;border:1px solid #303b59;background:#0e1527;color:#fff}.controls button{cursor:pointer;background:#293a68}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #26304a}.small{font-size:13px;opacity:.7}.err{color:#ff8d8d}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#777;margin-right:6px}.live .dot{background:#45e19a}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h1>WinGo Monitor</h1><div class="small">Read-only result & live-event dashboard</div></div><div id="status" class="badge"><span class="dot"></span>Disconnected</div></div>
<div class="controls"><input id="api" placeholder="API base e.g. https://.../api"><input id="token" type="password" placeholder="Authorized Bearer token"><input id="ws" placeholder="Server-issued WebSocket URL"><button onclick="save()">Connect</button></div>
<div class="grid"><div class="card"><div class="label">CURRENT PERIOD</div><div id="issue" class="value">—</div></div><div class="card"><div class="label">COUNTDOWN</div><div id="timer" class="value">—</div></div><div class="card"><div class="label">LATEST NUMBER</div><div id="num" class="value big">—</div></div><div class="card"><div class="label">SIZE</div><div id="size" class="value">—</div></div></div>
<div class="card" style="margin-top:14px"><div class="top"><h2>Recent Results</h2><button onclick="refresh()" style="padding:9px 12px;border-radius:9px;border:1px solid #303b59;background:#202d50;color:#fff">Refresh</button></div><div id="error" class="err"></div><table class="table"><thead><tr><th>Issue</th><th>Number</th><th>Big/Small</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<script>
let state={current:null,history:[]};
const $=id=>document.getElementById(id);
function size(n){n=Number(n);return Number.isFinite(n)?(n>=5?'Big':'Small'):'—'}
function render(){const c=state.current||{}; $('issue').textContent=c.issueNumber||'—'; $('num').textContent=c.number??'—'; $('size').textContent=size(c.number); $('rows').innerHTML=state.history.map(x=>`<tr><td>${x.issueNumber??'—'}</td><td>${x.number??'—'}</td><td>${size(x.number)}</td></tr>`).join('')}
async function save(){await fetch('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiBase:$('api').value.trim(),token:$('token').value.trim(),wsUrl:$('ws').value.trim()})}); live(); refresh()}
async function refresh(){try{const game=await fetch('/api/game-info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameCode:'WinGo_1M'})}).then(r=>r.json()); const c=game?.data?.current||game?.current||game?.data||{}; state.current=c; const h=await fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gameCode:'WinGo_1M'})}).then(r=>r.json()); state.history=h?.data?.list||h?.list||[]; render(); $('error').textContent='';}catch(e){$('error').textContent=e.message}}
function live(){const p=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${p}://${location.host}/live`);ws.onopen=()=>{ $('status').className='badge ok live';$('status').innerHTML='<span class="dot"></span>Panel live';};ws.onclose=()=>{$('status').className='badge';$('status').innerHTML='<span class="dot"></span>Disconnected';};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='event')refresh()}}
(async()=>{const c=await fetch('/config').then(r=>r.json());$('api').value=c.apiBase||'https://h5.ar-lottery06.com/api';$('ws').value=c.wsUrl||'';render()})();
</script></body></html>
